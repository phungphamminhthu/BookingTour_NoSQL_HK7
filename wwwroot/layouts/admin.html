<!DOCTYPE html>
<html lang="vi" >
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Expedition Admin - Vietnam Expeditions</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/material-symbols.css"/>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: { primary: "#1e3a8a", secondary: "#64748b", accent: "#3b82f6" }
            }
        }
    }
  </script>
  <style>
    .material-symbols-outlined {
    font-family: 'Material Symbols Outlined', sans-serif;
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }
    body { font-family: 'Public Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

<aside class="hidden md:flex flex-col h-screen w-64 fixed left-0 top-0 z-50 bg-slate-50 py-6 border-r border-slate-200">
  <div class="px-6 mb-8">
    <h1 class="text-lg font-black text-blue-900 mb-1 tracking-tighter">Admin Portal</h1>
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Vietnam Expedition</p>
  </div>
  <nav class="flex-1 space-y-1">
    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
        href="#">
      <span class="material-symbols-outlined">dashboard</span><span>Dashboard</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
        href="#">
      <span class="material-symbols-outlined">confirmation_number</span><span>Quản lý Tour</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
        href="#">
      <span class="material-symbols-outlined">category</span><span>Quản lý Danh mục</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
        href="#">
      <span class="material-symbols-outlined">map</span><span>Quản lý Chuyến đi</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
       href="#">
      <span class="material-symbols-outlined">location_on</span>
      <span>Quản lý Địa điểm</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
        href="#">
      <span class="material-symbols-outlined">group</span><span>Quản lý Khách hàng</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
       href="#">
      <span class="material-symbols-outlined">payments</span><span>Quản lý Giao Dịch</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm #"
       href="#">
      <span class="material-symbols-outlined">badge</span>
      <span>Quản lý Nhân Viên</span>
    </a>
  </nav>
     <div class="px-4 mt-auto border-t border-slate-200 pt-4">
    <button id="adminLogoutBtn" type="button" class="w-full text-red-500 hover:bg-red-50 rounded-xl px-4 py-2.5 flex items-center gap-3 transition-all text-sm font-semibold text-left">
      <span class="material-symbols-outlined">logout</span>
      <span>Đăng xuất</span>
    </button>
  </div>
</aside>

<main class="md:ml-64 min-h-screen flex flex-col">
  <header class="flex justify-end items-center w-full px-6 h-16 sticky top-0 bg-slate-50/80 backdrop-blur-xl z-40 shadow-sm border-b border-slate-200">

    <div class="flex items-center gap-4">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-blue-900 leading-none">Admin</p>
      </div>

      <div class="w-10 h-10 rounded-full border border-slate-200 overflow-hidden shadow-sm">
        <img src="https://pub-2198db5444f34bb593fc9eade3a65a70.r2.dev/avatars/avatar_admin-viet_1e3a8a.png"
             alt="Admin Profile"
             class="w-full h-full object-cover"/>
      </div>
    </div>
  </header>

  <div id="admin-main-content" class="p-6 lg:p-8 flex-1">
    <!-- Admin Content Container -->
  </div>
</main>

<script src="../assets/js/icons-fallback.js"></script>
</body>
</html>
